{% extends 'base.html' %}
{% block contenido %}
<h2>Editar mascota</h2>

<form method="post">
    {% csrf_token %}
    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre" name="nombre" value="{{ mascota.nombre }}" required><br><br>

    <label for="especie">Especie:</label><br>
    <input type="text" id="especie" name="especie" value="{{ mascota.especie }}" required><br><br>

    <label for="color">Color:</label><br>
    <input type="text" id="color" name="color" value="{{ mascota.color }}" required><br><br>

    <label for="descripcion">Descripcion:</label><br>
    <textarea id="descripcion" name="descripcion" required>{{ mascota.descripcion }}</textarea><br><br>

    <label for="estado">Estado:</label><br>
    <select id="estado" name="estado">
        <option value="perdida" {% if mascota.estado == 'perdida' %}selected{% endif %}>Perdida</option>
        <option value="encontrada" {% if mascota.estado == 'encontrada' %}selected{% endif %}>Encontrada</option>
    </select><br><br>

    <button type="submit">Guardar cambios</button>
</form>

<p><a href="{% url 'mascotas:detalle_mascota' mascota.id %}">Cancelar</a></p>
{% endblock %}
